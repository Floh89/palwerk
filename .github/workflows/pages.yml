name: Deploy PALWERK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download canonical Palworld datasets
        run: |
          mkdir -p data/upstream
          dashboard="https://raw.githubusercontent.com/Noval1th/PalworldDashboard/main/collector"
          savepal="https://raw.githubusercontent.com/oMaN-Rod/palworld-save-pal/main/data/json"
          curl -fL --retry 3 "$dashboard/pal-names.json" -o data/upstream/pal-names.json
          curl -fL --retry 3 "$dashboard/pal-types.json" -o data/upstream/pal-types.json
          curl -fL --retry 3 "$dashboard/pal-moves.json" -o data/upstream/pal-moves.json
          curl -fL --retry 3 "$dashboard/pal-passives.json" -o data/upstream/pal-passives.json
          curl -fL --retry 3 "$savepal/pals.json" -o data/upstream/pals-full.json
          curl -fL --retry 3 "$savepal/active_skills.json" -o data/upstream/active-skills-full.json
          curl -fL --retry 3 "$savepal/passive_skills.json" -o data/upstream/passive-skills-full.json
          curl -fL --retry 3 "$savepal/bosses.json" -o data/upstream/bosses.json
          curl -fL --retry 3 "$savepal/l10n/de/pals.json" -o data/upstream/pals-de.json
          curl -fL --retry 3 "$savepal/l10n/de/active_skills.json" -o data/upstream/active-skills-de.json
          curl -fL --retry 3 "$savepal/l10n/de/passive_skills.json" -o data/upstream/passive-skills-de.json
          curl -fL --retry 3 "https://palworld.wiki.gg/wiki/Module:PartnerSkills/data.json?action=raw" -o data/upstream/partner-skills.json || echo '{}' > data/upstream/partner-skills.json

          # Cargo caps each response at 500 rows even when a larger limit is requested.
          # Fetch all pages so late-alphabet partner skills (for example Sparkit) retain rank data.
          rm -f /tmp/partner-scales-*.json
          offset=0
          while [ "$offset" -lt 5000 ]; do
            page="/tmp/partner-scales-${offset}.json"
            url="https://palworld.wiki.gg/api.php?action=cargoquery&format=json&limit=500&offset=${offset}&tables=PalPartnerSkillScale&fields=partnerSkill,effectType,target,level,effectValue"
            if ! curl -fL --retry 3 "$url" -o "$page"; then
              break
            fi
            count=$(python3 -c "import json; print(len(json.load(open('$page')).get('cargoquery', [])))")
            if [ "$count" -eq 0 ]; then
              break
            fi
            offset=$((offset + 500))
            if [ "$count" -lt 500 ]; then
              break
            fi
          done
          python3 - <<'PY'
          import glob, json
          pages=[]
          for path in sorted(glob.glob('/tmp/partner-scales-*.json'), key=lambda p:int(p.rsplit('-',1)[1].split('.')[0])):
              try:
                  pages.extend(json.load(open(path, encoding='utf-8')).get('cargoquery', []))
              except Exception:
                  pass
          with open('data/upstream/partner-scales.json','w',encoding='utf-8') as f:
              json.dump({'cargoquery':pages},f,separators=(',',':'))
          print(f'Fetched {len(pages)} partner scale rows')
          PY
          node -e "for(const f of ['partner-skills.json','partner-scales.json']){try{JSON.parse(require('fs').readFileSync('data/upstream/'+f,'utf8'))}catch{require('fs').writeFileSync('data/upstream/'+f,'{}')}}"
      - name: Generate offline catalog
        run: |
          node scripts/build-core-data.mjs
          node scripts/build-partner-data.mjs
      - name: Test optimizer end-to-end logic
        run: npm run test:optimizer
      - name: Bundle Pal images
        run: |
          rm -rf /tmp/palworld-api
          git clone --depth 1 https://github.com/xpao24/palworld-api.git /tmp/palworld-api
          mkdir -p assets/pals
          cp /tmp/palworld-api/public/images/*.png assets/pals/
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=sorted(p.name for p in Path('assets/pals').glob('*.png'))
          Path('assets/pals/manifest.json').write_text(json.dumps(files,separators=(',',':')),encoding='utf-8')
          print(f'Bundled {len(files)} Pal images')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
